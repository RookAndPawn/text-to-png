[package]
name = "text-to-png"
version = "0.3.0"
edition = "2021"
authors = ["Kevin Guthrie <kevin.guthrie@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A simple way to render text to a png image with basic options"
readme = "README-COPY.md"
repository = "https://github.com/RookAndPawn/text-to-png"
keywords = ["text", "font", "rendering", "png", "svg"]
categories = ["encoding", "game-development", "text-processing", "visualization"]

[lib]
name = "text_to_png"
path = "src/lib.rs"

[dependencies]
fontdb="0.23.0"
usvg="0.45.1"
resvg={version = "0.45.1", default-features = false, features = ["text"] }
tiny-skia="0.11.4"
xml-rs="1.0.0"
derive-new="0.7.0"
siphasher="1.0.1"
thiserror="2.0.17"
png="0.17.6"

[dev-dependencies]
float-cmp="0.10.0"
image = "0.25.9"
criterion = { version = "0.8.0", features = ["html_reports"] }
rand = "0.9.2"
image-compare = "0.5.0"

[[bench]]
name = "render_bench_100pt"
harness = false
